name: Deploy Site (Option A — brain bleibt privat)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pflicht-Gate vor jedem Deploy (Yasin, 01.10.2026).
  # Bis dahin lief verify.py ausschliesslich von Hand: Ein Push, bei dem das vergessen
  # wurde, ging ungeprueft live. Als eigener Job statt als Schritt im Deploy, damit die
  # Abhaengigkeit strukturell ist (needs) und nicht von der Reihenfolge der Schritte
  # abhaengt.
  # verify.py braucht nur die Standardbibliothek und endet mit Exit 1, sobald ein Gate
  # rot ist; genau das stoppt hier den Deploy.
  verify:
    name: Gate - verify.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          # Geprueft: die Skripte nutzen keine Konstrukte oberhalb von 3.9, die
          # Festlegung dient nur der Reproduzierbarkeit.
          python-version: '3.12'

      - name: verify.py
        run: python3 scripts/verify.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact (nur die Site, nichts Internes)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude 'brain' \
            --exclude 'scripts' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.git' \
            --exclude '_site' \
            --exclude 'CLAUDE.md' \
            --exclude 'README.md' \
            --exclude 'STATUS.md' \
            --exclude 'SPC-Gaming-Visuals' \
            --exclude '.DS_Store' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
