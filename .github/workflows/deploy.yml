name: Deploy Site (Option A — brain bleibt privat)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pflicht-Gate vor jedem Deploy (Yasin, 01.10.2026).
  # Bis dahin lief verify.py ausschliesslich von Hand: Ein Push, bei dem das vergessen
  # wurde, ging ungeprueft live. Als eigener Job statt als Schritt im Deploy, damit die
  # Abhaengigkeit strukturell ist (needs) und nicht von der Reihenfolge der Schritte
  # abhaengt.
  # Alle drei Gates kommen mit der Python-Standardbibliothek aus und enden mit Exit 1,
  # sobald sie etwas finden; genau das stoppt hier den Deploy. Geprueft wurde das einzeln
  # mit eingeschleusten Defekten, und zwar ohne Pipe: hinter einer Pipe zeigt $? den Code
  # des letzten Glieds, nicht den von Python.
  # EINE Ausnahme, und sie ist der Grund fuer den node-Schritt unten: verify.py fuehrt
  # assets/js/finder.js mit `node` aus und prueft damit den §A6-Filter end-to-end. Fehlt
  # node, meldet verify eine WARNUNG und endet mit Exit 0 (gemessen am 05.10.2026) --
  # der Deploy bliebe gruen, waehrend das staerkste §A6-Gate uebersprungen wird.
  # mess_bilder.py --check fehlt bewusst: Es laedt jedes Bild bei Amazon nach und wuerde
  # in CI an deren Bot-Schutz scheitern. Dieses Gate bleibt Handarbeit.
  # Action-Versionen (05.10.2026): Jede Action steht auf einer Hauptversion, die auf
  # node24 laeuft. Vorher zielten checkout@v4, setup-node@v4, setup-python@v5,
  # upload-pages-artifact@v3 und deploy-pages@v4 auf Node.js 20 und wurden vom Runner auf
  # Node.js 24 gezwungen -- mit einer Deprecation-Warnung in JEDEM Lauf, in beiden Jobs.
  # Geprueft wurde das nicht am Versionsnamen, sondern an `runs.using` in der jeweiligen
  # action.yml. Besonderheit: upload-pages-artifact@v4 pinnt INTERN upload-artifact@v4.6.2
  # und haette die Warnung stehen lassen; erst v5 zieht auf v7.0.0.
  verify:
    name: Gate - verify, prosa, sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          # Diese Festlegung ist TRAGEND, nicht kosmetisch. Hier stand bis zum 05.10.
          # "die Skripte nutzen keine Konstrukte oberhalb von 3.9" -- gemessen falsch:
          # `gen_brand_sections.py:200` enthaelt einen Backslash im Ausdrucksteil eines
          # f-Strings, und das erlaubt erst PEP 701 ab 3.12. Mit 3.9 bricht die Datei
          # beim Parsen (nachgemessen mit 3.9.6: 37 der 38 Skripte parsen, dieses nicht), und
          # verify.py startet sie als Unter-Gate. Wer hier auf 3.11 oder tiefer geht,
          # macht aus dem Marken-Gate einen Absturz.
          python-version: '3.12'

      # Node kam bisher nur aus dem ubuntu-latest-Image: nirgends angefordert, nirgends
      # festgelegt. Das Image wechselt ab dem 19.10.2026 auf Ubuntu 26, und faellt node
      # dabei weg, wird aus dem §A6-Finder-Test stillschweigend eine Warnung bei Exit 0.
      # Deshalb hier angefordert und auf eine Hauptversion festgelegt.
      - name: Node einrichten (fuer den §A6-Finder-Test in verify.py)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Der Schritt faellt auch dann, wenn verify.py selbst gruen ist, die Warnung aber
      # zeigt, dass der Finder-Test uebersprungen wurde. Ohne diese drei Zeilen koennte
      # ein spaeterer Umbau den node-Schritt entfernen, ohne dass irgendetwas rot wird --
      # dieselbe Klasse wie ein geloeschtes Gate, das stumm gruen bleibt.
      # `set -o pipefail`, weil hinter einer Pipe sonst der Exit-Code von `tee` zaehlt.
      - name: verify.py
        run: |
          set -o pipefail
          python3 scripts/verify.py 2>&1 | tee "$RUNNER_TEMP/verify.log"
          if grep -q 'node fehlt' "$RUNNER_TEMP/verify.log"; then
            echo "::error::verify.py lief ohne node — der §A6-Finder-Test wurde uebersprungen, der Lauf beweist §A6 also nicht"
            exit 1
          fi

      - name: audit_prosa.py
        run: python3 scripts/audit_prosa.py

      - name: sync_product_values.py --audit
        run: python3 scripts/sync_product_values.py --audit

      # Die vier Gates, die bis zum 05.10. NIRGENDS in CI liefen. Von den vierzehn
      # Gates des Repos fahren drei hier oben, fuenf laufen als Unter-Gate ueber
      # verify.py mit (gen_brand_sections, gen_preisfrage, gen_bestenliste,
      # sync_hublinks, sync_guenstiger, sync_zeitversprechen, sync_positionierung) --
      # diese vier liefen nur auf Yasins Rechner. Ein Push, der eines davon bricht,
      # deployte gruen.
      # Zusammen 1,6 Sekunden, gemessen am 05.10.2026: Es war nie die Laufzeit.
      - name: sync_footer.py --check
        run: python3 scripts/sync_footer.py --check

      - name: sync_lesezeit.py --check
        run: python3 scripts/sync_lesezeit.py --check

      - name: sync_kompat.py --check
        run: python3 scripts/sync_kompat.py --check

      - name: css_kaskade.py
        run: python3 scripts/css_kaskade.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build artifact (nur die Site, nichts Internes)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude 'brain' \
            --exclude 'scripts' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.git' \
            --exclude '_site' \
            --exclude 'CLAUDE.md' \
            --exclude 'README.md' \
            --exclude 'STATUS.md' \
            --exclude 'SPC-Gaming-Visuals' \
            --exclude '.DS_Store' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
